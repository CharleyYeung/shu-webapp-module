<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activity 4-7 - Dice Battle</title>
    <link rel="stylesheet" href="css/styles4-7.css">
</head>

<body>

    <header class="top-header">
        <a href="../index.html">
            <img src="../week1/img/homepage.png" class="home-icon" alt="Homepage">
        </a>
    </header>

    <main>
        <section class="section-form">
            <h2>Dice Battle Game</h2>
            <p>Roll the card dice and compete against the computer!</p>

            <!-- Dice Battle Container -->
            <div class="dice-battle-container">
                <!-- Player Dice -->
                <div class="player-box">
                    <h3>Your Dice</h3>
                    <div class="scene">
                        <div class="card" id="player-card">
                            <div class="card-face card-front">
                                <img src="../week1/img/dice-shield.svg" alt="Dice Shield">
                            </div>
                            <div class="card-face card-back">
                                <img id="player-img" src="../week1/img/six.svg" alt="Your Dice">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Computer Dice -->
                <div class="player-box">
                    <h3>Computer Dice</h3>
                    <div class="scene">
                        <div class="card" id="computer-card">
                            <div class="card-face card-front">
                                <img src="../week1/img/dice-shield.svg" alt="Dice Shield">
                            </div>
                            <div class="card-face card-back">
                                <img id="computer-img" src="../week1/img/six.svg" alt="Computer Dice">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="game-controls">
                <button id="roll-btn" class="roll-button">Click to Roll</button>
            </div>

            <div id="result-box" class="result-text">Click the button to start!</div>

            <div class="image-viewer" id="result-viewer"></div>
        </section>

        <footer>
            <a href="../index.html">
                <img src="../week1/img/Back-icon.png" class="back-link" alt="Go back to homepage">
            </a>
        </footer>
    </main>

    <script src="script4-7.js"></script>
</body>

</html>
