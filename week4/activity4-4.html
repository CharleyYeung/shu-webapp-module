<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activity 4-4 - Cloudy Gallery</title>
    <link rel="stylesheet" href="css/styles4-4.css">
</head>

<body>

    <header class="top-header">
        <a href="../index.html">
            <img src="../Week1/My First Web App/img/homepage.png" class="home-icon" alt="Homepage">
        </a>
    </header>

    <main>
        <section class="section-form">
            <h2>Choose Cloudy's Photo</h2>

            <form class="photo-form">
                <label for="cloudy-select">Select a pose:</label>
                <select id="cloudy-select" name="cloudy_pose">
                    <option value="" disabled selected>-- Please choose an option --</option>
                    <option value="closeup">Close Up</option>
                    <option value="lookout">Look Out</option>
                    <option value="yawning">Yawning</option>
                </select>
            </form>

            <div class="image-viewer"></div>
        </section>

        <footer>
            <a href="../index.html">
                <img src="../Week1/My First Web App/img/Back-icon.png" class="back-link" alt="Go back to homepage">
            </a>
        </footer>
    </main>

</body>

</html>
