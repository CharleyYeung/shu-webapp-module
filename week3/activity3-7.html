<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activity 3-7</title>
    <link rel="stylesheet" href="css/styles3-7.css">
</head>

<body>

    <header class="top-header">
        <a href="../index.html">
            <img src="../week1/img/homepage.png" class="home-icon">
        </a>
    </header>

    <main>
        <section class="section-bounce">
            <h2>Bounce Animation</h2>
            <br>
            <br>
            <img src="../week1/img/Cloudy-yawning.JPG" alt="Cloudy yawning" class="bounce-img">
        </section>

        <section class="section-flip">
            <h2>Flip Cards</h2>

            <div class="flip-grid">

                <div class="flip-card">
                    <div class="flip-inner">
                        <div class="flip-front">
                            <img src="../week1/img/Cloudy-face-1.JPG" alt="Cloudy looking forward">
                        </div>
                        <div class="flip-back">
                            <img src="../week1/img/Cloudy-face-2.JPG" alt="Cloudy turning head">
                        </div>
                    </div>
                </div>

                <div class="flip-card">
                    <div class="flip-inner">
                        <div class="flip-front">
                            <img src="../week1/img/Cloudy-lookout-1.JPG" alt="Cloudy looking outside">
                        </div>
                        <div class="flip-back">
                            <img src="../week1/img/Cloudy-lookout-2.JPG"
                                alt="Cloudy watching something">
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <footer>
            <a href="../index.html">
                <img src="../week1/img/Back-icon.png" class="back-link"
                    aria-label="Go back to homepage">
            </a>
        </footer>

    </main>

</body>

</html>
