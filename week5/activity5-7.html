<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Temperament Explorer</title>
    <link rel="stylesheet" href="css/activity5-7.css">
</head>

<body>

    <!-- Header & Home Navigation -->
    <header class="top-header">
        <a href="../index.html">
            <img src="../week1/img/homepage.png" class="home-icon" alt="Homepage">
        </a>
    </header>

    <main>
        <section class="section-form">
            <h2>Cat Temperament Explorer</h2>
            <p>Select a temperament trait to explore cat breeds or view our resident cat, Cloudy!</p>

            <!-- Control Panel: Select, Fetch, and Reset Buttons -->
            <div id="controls" class="api-controls">
                <select id="temperament-select" class="control-select" aria-label="Select cat temperament">
                    <option value="sociable">Sociable</option>
                    <option value="playful">Playful</option>
                    <option value="active">Active</option>
                    <option value="gentle">Gentle</option>
                    <option value="bossy">Bossy</option>
                </select>
                <button id="fetch-cats-btn" class="control-button">Fetch Cats</button>
                <button id="reset-btn" class="control-button reset-button">Reset</button>
            </div>

            <!-- System Status Display -->
            <p class="status-text">Status: <span id="status-display" aria-live="polite">Idle</span></p>

            <!-- Results Grid containing Cloudy as the default card and dynamic API cards -->
            <div id="results-container" class="cat-grid">
                <!-- Default Resident Card: Cloudy -->
                <div id="cloudy-card" class="cat-card resident-card">
                    <img src="../week1/img/Cloudy-face-1.JPG" alt="Cloudy the Resident Cat"
                        class="cat-image">
                    <h3>Cloudy (Resident Chief)</h3>
                    <p><strong>Temperament:</strong> Affectionate, Curious, Calm</p>
                    <p class="cat-desc">Our official household master and absolute ruler.</p>
                </div>
            </div>
        </section>

        <!-- Footer & Back Navigation -->
        <footer>
            <a href="../index.html">
                <img src="../week1/img/Back-icon.png" class="back-link" alt="Go back to homepage">
            </a>
        </footer>
    </main>

    <!-- ES Module JavaScript Link -->
    <script src="webapi.js" type="module"></script>
</body>

</html>
