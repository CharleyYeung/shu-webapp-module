<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Temperament Explorer</title>
    <link rel="stylesheet" href="css/activity5-7.css">
</head>

<body>

    <header class="top-header">
        <a href="../index.html">
            <img src="../Week1/My First Web App/img/homepage.png" class="home-icon" alt="Homepage">
        </a>
    </header>

    <main>
        <section class="section-form">
            <h2>Cat Temperament Explorer</h2>
            <p>Select a temperament trait and fetch cat breeds using FreeAPI!</p>

            <!-- control -->
            <div id="controls" class="api-controls">
                <select id="temperament-select" class="control-select">
                    <option value="sociable">Sociable</option>
                    <option value="playful">Playful</option>
                    <option value="active">Active</option>
                    <option value="gentle">Gentle</option>
                </select>
                <button id="fetch-cats-btn" class="control-button">Fetch Cats</button>
            </div>

            <!-- System Status Display -->
            <p class="status-text">Status: <span id="status-display">Idle</span></p>

            <!-- Results Grid -->
            <div id="results-container" class="cat-grid">
                <!-- dynamically generated cat cards -->
            </div>
        </section>

        <footer>
            <a href="../index.html">
                <img src="../Week1/My First Web App/img/Back-icon.png" class="back-link" alt="Go back to homepage">
            </a>
        </footer>
    </main>

    <!-- ES Module Script -->
    <script src="webapi.js" type="module"></script>
</body>

</html>
