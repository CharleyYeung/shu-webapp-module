<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galton Board Simulation</title>
    <link rel="stylesheet" href="css/activity5-4.css">
</head>

<body>

    <!-- Header & Home Navigation -->
    <header class="top-header">
        <a href="../index.html">
            <img src="../Week1/My First Web App/img/homepage.png" class="home-icon" alt="Homepage">
        </a>
    </header>

    <main>
        <section class="section-form">
            <h2>Galton Board Simulation</h2>
            <p>Watch the marbles fall through the peg board and form a bell curve!</p>

            <!-- Simulation Container -->
            <div id="container">
                <!-- Peg Grid (5 Levels) -->
                <div class="node" style="top: 30px; left: 195px;"></div>

                <div class="node" style="top: 70px; left: 175px;"></div>
                <div class="node" style="top: 70px; left: 215px;"></div>

                <div class="node" style="top: 110px; left: 155px;"></div>
                <div class="node" style="top: 110px; left: 195px;"></div>
                <div class="node" style="top: 110px; left: 235px;"></div>

                <div class="node" style="top: 150px; left: 135px;"></div>
                <div class="node" style="top: 150px; left: 175px;"></div>
                <div class="node" style="top: 150px; left: 215px;"></div>
                <div class="node" style="top: 150px; left: 255px;"></div>

                <div class="node" style="top: 190px; left: 115px;"></div>
                <div class="node" style="top: 190px; left: 155px;"></div>
                <div class="node" style="top: 190px; left: 195px;"></div>
                <div class="node" style="top: 190px; left: 235px;"></div>
                <div class="node" style="top: 190px; left: 275px;"></div>

                <!-- Collection Bins Base -->
                <div id="base">
                    <div class="bin" id="bin-0"></div>
                    <div class="bin" id="bin-1"></div>
                    <div class="bin" id="bin-2"></div>
                    <div class="bin" id="bin-3"></div>
                    <div class="bin" id="bin-4"></div>
                    <div class="bin" id="bin-5"></div>
                </div>
            </div>

            <!-- Control Buttons -->
            <div id="controls">
                <button id="start-btn" class="control-button">Start</button>
                <button id="stop-btn" class="control-button">Stop</button>
                <button id="reset-btn" class="control-button">Reset</button>
            </div>

            <!-- System Status Display -->
            <p class="status-text">Status: <span id="status-display">Idle</span></p>
        </section>

        <!-- Footer & Back Navigation -->
        <footer>
            <a href="../index.html">
                <img src="../Week1/My First Web App/img/Back-icon.png" class="back-link" alt="Go back to homepage">
            </a>
        </footer>
    </main>

    <!-- ES Module Script -->
    <script type="module" src="animation.js"></script>
</body>

</html>
